packages:
  - "apps/*"
  - "packages/*"

# Packages must be at least 3 days old to be installed
minimumReleaseAge: 4320
# Trusted packages
minimumReleaseAgeExclude:
  - "@matterlabs/zksync-js"

# Allow exotic sources for direct dependencies only
blockExoticSubdeps: true

# Helps preventing trust level downgrades when updating dependencies
trustPolicy: no-downgrade
# 1 month in minutes: 24 * 60 * 30
trustPolicyIgnoreAfter: 43200
# Exclude verified packages that lost provenance attestation
trustPolicyExclude:
  - "@coinbase/cdp-sdk"

# Always use TLS
strictSsl: true

# Verify integrity of packages in the store
verifyStoreIntegrity: true

# Disable running third-party postinstall scripts
ignoreDepScripts: true

overrides:
  # zod 4.4 makes bare z.unknown() object keys required — hold 4.3.5 until callers are audited.
  "zod@^4.3.5": 4.3.5
  # Type identity, not a security pin. `@repo/api-kit` belongs to two workspaces, so
  # only one owns its node_modules, and a type crossing that boundary unifies only
  # when both resolve the same version. Drizzle's peer set is part of its identity: a
  # `pg` or OpenTelemetry drift splits `drizzle-orm` in two and its `Table` and
  # `PgTransaction` types stop being assignable.
  "@opentelemetry/api": 1.9.1
  "pg": 8.23.0
  "semver@<7": ^7.7.3
  "@noble/curves@<1.9": ^1.9.7
  "@noble/hashes@<1.8": ^1.8.0
  "fast-uri@<3.1.5": ^3.1.5
  "flatted@<3.4.2": ^3.4.2
  "axios@<1.18.0": ^1.18.0
  "shell-quote@<1.9.0": ^1.9.0
  "viem>ws@<8.21.0": ^8.21.0
  "engine.io-client>ws@<8.21.0": ^8.21.0
  "lodash-es@<4.18.0": ^4.18.0
  "abitype@>=1.0.0 <1.2.0": ^1.2.4
  "@actions/http-client@<3.0.2": ^3.0.2
  "h3@<1.15.6": ^1.15.6
  "basic-ftp@<5.2.0": ^5.2.0
  "@esbuild-kit/core-utils>esbuild@<0.25.0": ^0.25.9
  "tar@<7.5.19": ^7.5.19
  "js-yaml@<3.15.0": ^3.15.0
  "js-yaml@>=4 <4.3.0": ^4.3.0
  "brace-expansion@>=2 <2.1.4": ^2.1.4
  "brace-expansion@>=5 <5.0.9": ^5.0.9
  "linkify-it@<5.0.2": ^5.0.2
  "socket.io-parser@<4.2.7": ^4.2.7
  "ip-address@>=10 <10.3.1": ^10.3.1
  "undici@>=7 <7.29.0": ^7.29.0
  "postcss@<8.5.18": ^8.5.18

