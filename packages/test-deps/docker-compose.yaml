services:
  postgres:
    image: "postgres:18"
    # Tuned for an ephemeral test DB under a highly-parallel suite. Durability is
    # disabled on purpose (fsync/synchronous_commit/full_page_writes off): the data
    # volume is throwaway, so we trade crash-safety for far less disk-sync overhead.
    command: >
      postgres
      -c max_connections=1000
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c checkpoint_timeout=30min
    # Postgres parallel workers and large buffers use /dev/shm; the 64MB default is too small.
    shm_size: '1gb'
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - '127.0.0.1:5500:5432'
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    environment:
      # We bind only to 127.0.0.1, so setting insecure password is acceptable here
      - POSTGRES_PASSWORD=notsecurepassword
      # postgres:18 moved the default PGDATA to a version-specific subdir; pin it to the
      # mount path so the existing volume layout keeps working.
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 1s
      timeout: 5s
      retries: 15

name: prividium-test-deps

volumes:
  postgres-data:
