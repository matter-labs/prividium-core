name: Feature request
description: Suggest a change, an improvement, or a new capability
title: '[Request]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request! Please fill out as much as you can, the more details the better we can help to implement the feature.

        Anything that is not a bug belongs here, including documentation gaps and developer-experience papercuts.
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: A clear and concise description of what the feature is.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 🤔 Rationale
      description: Why do you think this feature is important and how will it benefit the project?
  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives considered
      description: Other approaches you looked at, and why you did not choose them.
  - type: textarea
    id: additional
    attributes:
      label: 📋 Additional context
      description: Add any other context or information about the feature request here.
