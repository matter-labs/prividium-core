name: Bug report
description: File a bug report to help us improve
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please fill out as much as you can, the more details the better we can help to resolve the issue.

        Do not report a suspected vulnerability here — follow the security policy in `SECURITY.md` instead. Keep secrets, private keys and production data out of this form.
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔄 Reproduction steps
      description: Steps to reproduce the behavior.
  - type: textarea
    id: expected
    attributes:
      label: 🤔 Expected behavior
      description: What did you expect to happen.
  - type: textarea
    id: actual
    attributes:
      label: 😯 Actual behavior
      description: What actually happened.
  - type: textarea
    id: environment
    attributes:
      label: 🖥 Environment
      description: Version or commit, Node.js version, and operating system.
  - type: textarea
    id: additional
    attributes:
      label: 📋 Additional context
      description: Add any other context about the problem here. If applicable, add screenshots to help explain.
  - type: textarea
    id: logs
    attributes:
      label: 📎 Logs
      description: If applicable, add logs to help explain the problem.
      render: shell
